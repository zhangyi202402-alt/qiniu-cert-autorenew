{% extends "base.html" %}
{% block title %}注册 — SSL 证书服务{% endblock %}
{% block content %}
<div class="section-card auth-card">
  <h1>注册</h1>
  {% if error %}<div class="banner banner--err">{{ error }}</div>{% endif %}
  <form method="post" action="/register" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <md-outlined-text-field label="邮箱" type="email" name="email" required autocomplete="username"></md-outlined-text-field>
    <md-outlined-text-field label="密码（至少 8 位）" type="password" name="password" required minlength="8" autocomplete="new-password"></md-outlined-text-field>
    <div class="form-actions">
      <md-filled-button type="submit">创建账号</md-filled-button>
    </div>
  </form>
  <p class="supporting">已有账号？<a href="/login">登录</a></p>
</div>
{% endblock %}
