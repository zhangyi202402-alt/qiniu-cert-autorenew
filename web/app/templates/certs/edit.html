{% extends "base.html" %}
{% block title %}编辑证书 — {{ cert.name }}{% endblock %}
{% block content %}
<section class="section-card">
  <h1>编辑证书</h1>
  <p class="supporting">可改绑配置档、签发域名与部署目标。若主域名变更，归属验证将重置为 unverified。</p>
  {% if error %}<div class="banner banner--err">{{ error }}</div>{% endif %}
  <form method="post" action="/certs/{{ cert.id }}/edit" class="form-stack" style="max-width:640px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <md-outlined-text-field label="名称" name="name" required maxlength="128" value="{{ form.name }}"></md-outlined-text-field>
    <label class="field-label" for="profile_id">配置档</label>
    <select name="profile_id" id="profile_id" class="native-field" required>
      {% for p in profiles %}
      <option value="{{ p.id }}" data-type="{{ p.deploy_type }}" {% if form.profile_id|string == p.id|string %}selected{% endif %}>{{ p.name }} ({{ p.deploy_type }})</option>
      {% endfor %}
    </select>
    <md-outlined-text-field label="ACME 邮箱" type="email" name="acme_email" required value="{{ form.acme_email }}"></md-outlined-text-field>
    <label class="field-label" for="issue_domains">签发域名</label>
    <textarea class="native-field" name="issue_domains" id="issue_domains" required>{{ form.issue_domains }}</textarea>
    <div id="cdn-box">
      <label class="field-label" for="cdn_domains">CDN 加速域名</label>
      <textarea class="native-field" name="cdn_domains" id="cdn_domains">{{ form.cdn_domains }}</textarea>
    </div>
    <div id="clb-box" style="display:none;">
      <label class="field-label" for="clb_targets">阿里 CLB 目标</label>
      <textarea class="native-field" name="clb_targets" id="clb_targets">{{ form.clb_targets }}</textarea>
    </div>
    <md-outlined-text-field label="续签提前天数" type="number" name="renew_days" value="{{ form.renew_days }}" min="7" max="60"></md-outlined-text-field>
    <div class="form-actions">
      <md-filled-button type="submit">保存</md-filled-button>
      <a href="/certs" style="text-decoration:none;"><md-outlined-button type="button">取消</md-outlined-button></a>
    </div>
  </form>
</section>
<script>
(function(){
  var sel = document.getElementById('profile_id');
  var cdnBox = document.getElementById('cdn-box');
  var clbBox = document.getElementById('clb-box');
  function sync(){
    if(!sel || !sel.options.length) return;
    var t = sel.options[sel.selectedIndex].getAttribute('data-type') || '';
    cdnBox.style.display = (t === 'qiniu_cdn' || t === 'aliyun_cdn') ? '' : 'none';
    clbBox.style.display = (t === 'aliyun_clb') ? '' : 'none';
  }
  if(sel){ sel.addEventListener('change', sync); sync(); }
})();
</script>
{% endblock %}
