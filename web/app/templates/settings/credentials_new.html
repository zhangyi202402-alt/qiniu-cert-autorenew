{% extends "base.html" %}
{% block title %}添加凭证 — SSL 证书服务{% endblock %}
{% block content %}
<p class="supporting"><a href="/settings/credentials">← 返回列表</a></p>
{% if error %}<div class="banner banner--err">{{ error }}</div>{% endif %}
<section class="section-card">
  <h1>添加凭证</h1>
  <form method="post" action="/settings/credentials" class="form-stack" id="cred-new-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <md-outlined-text-field label="名称" name="name" required maxlength="128" placeholder="例如 卡拉丁主账号"></md-outlined-text-field>
    <label class="supporting" for="provider-native">云厂商</label>
    <select name="provider" id="provider-native" required style="width:100%;padding:0.75rem;border-radius:8px;border:1px solid var(--md-sys-color-outline-variant);font:inherit;background:#fff;">
      <option value="aliyun">阿里云</option>
      <option value="tencent">腾讯云</option>
      <option value="qiniu">七牛</option>
    </select>
    <md-outlined-text-field label="AccessKey / SecretId" type="password" name="access_key" required autocomplete="off"></md-outlined-text-field>
    <md-outlined-text-field label="SecretKey" type="password" name="secret_key" required autocomplete="off"></md-outlined-text-field>
    <div id="cas-field">
      <md-outlined-text-field label="CAS 地域（仅阿里云）" name="cas_certificate_region" value="cn-hangzhou"></md-outlined-text-field>
    </div>
    <div class="form-actions">
      <a href="/settings/credentials" style="text-decoration:none;"><md-outlined-button type="button">取消</md-outlined-button></a>
      <md-filled-button type="submit">保存凭证</md-filled-button>
    </div>
  </form>
</section>
<script>
(function(){
  var sel = document.getElementById('provider-native');
  var cas = document.getElementById('cas-field');
  function sync(){ cas.hidden = sel.value !== 'aliyun'; }
  sel.addEventListener('change', sync);
  sync();
})();
</script>
{% endblock %}
