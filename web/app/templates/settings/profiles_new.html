{% extends "base.html" %}
{% block title %}添加配置档 — SSL 证书服务{% endblock %}
{% block content %}
<p class="supporting"><a href="/settings/profiles">← 返回列表</a></p>
{% if error %}<div class="banner banner--err">{{ error }}</div>{% endif %}
<section class="section-card">
  <h1>添加配置档</h1>
  {% if not credentials %}
  <div class="warn">请先添加至少一条 <a href="/settings/credentials">云凭证</a>。</div>
  {% else %}
  <form method="post" action="/settings/profiles" class="profile-form form-stack" style="max-width:640px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <md-outlined-text-field label="名称" name="name" required maxlength="128" placeholder="例如 kalading-cdn"></md-outlined-text-field>
    <label class="field-label">DNS 插件</label>
    <select name="dns_provider" class="dns-provider native-field">
      <option value="dns_ali">阿里云 DNS (dns_ali)</option>
      <option value="dns_tencent">腾讯云 DNS (dns_tencent)</option>
    </select>
    <label class="field-label">DNS 凭证</label>
    <select name="dns_credential_id" class="dns-cred native-field" required></select>
    <label class="field-label">部署类型</label>
    <select name="deploy_type" class="deploy-type native-field">
      <option value="qiniu_cdn">七牛 CDN HTTPS</option>
      <option value="aliyun_cdn">阿里云 CDN HTTPS</option>
      <option value="aliyun_clb">阿里云 CLB HTTPS</option>
    </select>
    <label class="field-label">部署凭证</label>
    <select name="deploy_credential_id" class="deploy-cred native-field" required></select>
    <label class="field-label">建议部署目标（可选预填）</label>
    <textarea class="native-field" name="suggested_targets" placeholder="CDN 域名每行一个，或 CLB: region,lb_id,port,probe"></textarea>
    <div class="form-actions">
      <a href="/settings/profiles" style="text-decoration:none;"><md-outlined-button type="button">取消</md-outlined-button></a>
      <md-filled-button type="submit">保存配置档</md-filled-button>
    </div>
  </form>
  {% endif %}
</section>
{% if credentials %}
<script>
(function(){
  var creds = {{ credentials_json|safe }};
  var dnsMap = {dns_ali:'aliyun', dns_tencent:'tencent'};
  var depMap = {qiniu_cdn:'qiniu', aliyun_cdn:'aliyun', aliyun_clb:'aliyun'};
  function fill(sel, provider, selected){
    if(!sel) return;
    sel.innerHTML = '';
    creds.filter(function(c){ return c.provider===provider; }).forEach(function(c){
      var o = document.createElement('option');
      o.value = c.id; o.textContent = '['+c.provider+'] '+c.name;
      if(String(selected)===String(c.id)) o.selected = true;
      sel.appendChild(o);
    });
  }
  document.querySelectorAll('.profile-form').forEach(function(form){
    var dnsP = form.querySelector('.dns-provider');
    var depT = form.querySelector('.deploy-type');
    var dnsC = form.querySelector('.dns-cred');
    var depC = form.querySelector('.deploy-cred');
    function sync(){
      fill(dnsC, dnsMap[dnsP.value], dnsC.getAttribute('data-selected'));
      fill(depC, depMap[depT.value], depC.getAttribute('data-selected'));
    }
    dnsP.addEventListener('change', function(){ dnsC.removeAttribute('data-selected'); sync(); });
    depT.addEventListener('change', function(){ depC.removeAttribute('data-selected'); sync(); });
    sync();
  });
})();
</script>
{% endif %}
{% endblock %}
