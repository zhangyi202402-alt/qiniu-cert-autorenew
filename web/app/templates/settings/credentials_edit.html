{% extends "base.html" %}
{% block title %}编辑凭证 — SSL 证书服务{% endblock %}
{% block content %}
<p class="supporting"><a href="/settings/credentials">← 返回列表</a></p>
{% if error %}<div class="banner banner--err">{{ error }}</div>{% endif %}
<section class="section-card">
  <div class="page-head" style="margin-bottom:0.5rem;">
    <h1>编辑凭证</h1>
    <md-assist-chip label="{% if cred.provider=='aliyun' %}阿里云{% elif cred.provider=='tencent' %}腾讯云{% else %}七牛{% endif %}"></md-assist-chip>
  </div>
  <p class="supporting">密钥留空表示不修改已保存密文。</p>
  <form method="post" action="/settings/credentials/{{ cred.id }}/update" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <md-outlined-text-field label="名称" name="name" required maxlength="128" value="{{ cred.name }}"></md-outlined-text-field>
    <md-outlined-text-field label="AccessKey / SecretId" type="password" name="access_key" autocomplete="off" placeholder="留空表示不修改"></md-outlined-text-field>
    <md-outlined-text-field label="SecretKey" type="password" name="secret_key" autocomplete="off" placeholder="留空表示不修改"></md-outlined-text-field>
    {% if cred.provider == 'aliyun' %}
    <md-outlined-text-field label="CAS 地域" name="cas_certificate_region" value="cn-hangzhou"></md-outlined-text-field>
    {% else %}
    <input type="hidden" name="cas_certificate_region" value="cn-hangzhou">
    {% endif %}
    <div class="form-actions">
      <a href="/settings/credentials" style="text-decoration:none;"><md-outlined-button type="button">取消</md-outlined-button></a>
      <md-filled-button type="submit">保存更改</md-filled-button>
    </div>
  </form>
</section>
{% endblock %}
