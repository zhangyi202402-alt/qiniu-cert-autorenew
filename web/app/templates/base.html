<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SSL 证书服务{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1a1f2e;
      --muted: #5c6578;
      --accent: #0b6e4f;
      --accent-2: #c45c26;
      --card: #fffef9;
      --line: #d9d3c7;
      --danger: #a32020;
      --ok: #0b6e4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Source Han Sans SC", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(ellipse at 10% 0%, #e8f0ea 0%, transparent 50%),
        radial-gradient(ellipse at 90% 10%, #f3e9df 0%, transparent 45%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 1.25rem; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 0 1.5rem; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem;
    }
    .brand { font-weight: 700; letter-spacing: -0.02em; font-size: 1.15rem; }
    nav a { margin-left: 1rem; color: var(--muted); }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 8px 24px rgba(26,31,46,0.04);
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; letter-spacing: -0.03em; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.75rem 0 0.35rem; }
    input, select, textarea {
      width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--line);
      border-radius: 8px; font: inherit; background: #fff;
    }
    textarea { min-height: 90px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; }
    button, .btn {
      display: inline-block; margin-top: 1rem; padding: 0.65rem 1.1rem;
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      font: inherit; cursor: pointer;
    }
    button.secondary, .btn.secondary { background: #4a5568; }
    .error { color: var(--danger); background: #fdeeee; padding: 0.75rem; border-radius: 8px; margin: 0.75rem 0; }
    .ok { color: var(--ok); background: #e8f5ef; padding: 0.75rem; border-radius: 8px; margin: 0.75rem 0; }
    .warn { color: #7a4a00; background: #fff4e0; padding: 0.75rem; border-radius: 8px; margin: 0.75rem 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 0.65rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
      font-size: 0.75rem; background: #eef1f5; color: var(--muted);
    }
    .badge.active, .badge.verified { background: #e8f5ef; color: var(--ok); }
    .badge.failed, .badge.lost { background: #fdeeee; color: var(--danger); }
    .badge.issuing, .badge.renewing, .badge.pending_verification, .badge.unverified {
      background: #fff4e0; color: #7a4a00;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #f0ece4; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.88em;
    }
    .hint { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    .actions form { display: inline; }
    .actions button { margin-top: 0; margin-right: 0.35rem; padding: 0.35rem 0.7rem; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><a href="/certs">Qiniu Cert Web</a></div>
      <nav>
        {% if user is defined and user %}
          <a href="/certs">证书</a>
          <a href="/settings/credentials">凭证</a>
          <a href="/settings/profiles">配置档</a>
          <a href="/logout">退出</a>
        {% else %}
          <a href="/login">登录</a>
          <a href="/register">注册</a>
        {% endif %}
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
