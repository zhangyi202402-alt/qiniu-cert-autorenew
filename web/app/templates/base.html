<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SSL 证书服务{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Noto+Sans+SC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <!-- 内网可把下方 esm.run 换成镜像 -->
  <script type="importmap">
  {
    "imports": {
      "@material/web/": "https://esm.run/@material/web/"
    }
  }
  </script>
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    if (typescaleStyles?.styleSheet) {
      document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    }
  </script>
  <style>
    :root {
      --md-sys-color-primary: #0f6b58;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #a5f2d7;
      --md-sys-color-on-primary-container: #002117;
    }
    md-icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-bar">
    <a class="app-bar__brand" href="/certs">Qiniu Cert Web</a>
    <nav class="app-bar__nav">
      {% if user is defined and user %}
        <a href="/certs"><md-text-button type="button">证书</md-text-button></a>
        <a href="/settings/credentials"><md-text-button type="button">凭证</md-text-button></a>
        <a href="/settings/profiles"><md-text-button type="button">配置档</md-text-button></a>
        <a href="/logout"><md-text-button type="button">退出</md-text-button></a>
      {% else %}
        <a href="/login"><md-text-button type="button">登录</md-text-button></a>
        <a href="/register"><md-text-button type="button">注册</md-text-button></a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
