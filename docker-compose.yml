# 七牛 CDN 证书自动续签 — Docker Compose
#
# 准备:
#   cp .env.example .env && 填写凭据
#   cp config.example.yaml config.yaml && 编辑域名与 acme 配置
#
# 首次签发 + 部署:
#   docker compose --profile setup run --rm setup
#
# 启动定时任务（supercronic）:
#   docker compose up -d scheduler

services:
  scheduler:
    build: .
    image: qiniu-cert-autorenew:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      QINIU_CERT_ROOT: /app
      QINIU_CERT_CONFIG: /app/config.yaml
    volumes:
      - ${QINIU_CERT_CONFIG_FILE:-./config.yaml}:/app/config.yaml:ro
      - ./.local:/app/.local
    command: ["/usr/local/bin/supercronic", "/app/scripts/crontab.docker"]

  setup:
    profiles: [setup]
    build: .
    image: qiniu-cert-autorenew:latest
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      QINIU_CERT_ROOT: /app
      QINIU_CERT_CONFIG: /app/config.yaml
    volumes:
      - ${QINIU_CERT_CONFIG_FILE:-./config.yaml}:/app/config.yaml:ro
      - ./.local:/app/.local
    command: ["/app/scripts/setup.sh"]

  renew:
    profiles: [tools]
    build: .
    image: qiniu-cert-autorenew:latest
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      QINIU_CERT_ROOT: /app
      QINIU_CERT_CONFIG: /app/config.yaml
    volumes:
      - ${QINIU_CERT_CONFIG_FILE:-./config.yaml}:/app/config.yaml:ro
      - ./.local:/app/.local
    command: ["/app/scripts/cron-acme.sh"]

  probe:
    profiles: [tools]
    build: .
    image: qiniu-cert-autorenew:latest
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      QINIU_CERT_ROOT: /app
      QINIU_CERT_CONFIG: /app/config.yaml
    volumes:
      - ${QINIU_CERT_CONFIG_FILE:-./config.yaml}:/app/config.yaml:ro
      - ./.local:/app/.local
    command: ["/app/scripts/cron-tls.sh"]
